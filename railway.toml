# Railway config-as-code, read when a service's Root Directory is the
# repository root (leave the field empty or "/"). Both workers build from the
# root Dockerfile; the only per-service setting left in the dashboard is the
# Start Command:
#   bot      pnpm --filter @o1bot/bot start      (also the image default)
#   indexer  pnpm --filter @o1bot/indexer start
# A subfolder Root Directory such as apps/bot must NOT be used: from there
# Railway sees a single package.json without the pnpm workspace or lockfile.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
